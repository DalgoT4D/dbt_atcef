models:
  - name: farmer_endline_gramin_25
    description: "Farmer data compiled with Endline Status from encounters"
    columns:
      - name: farmer_id
        tests:
          - not_null
      - name: farmer_name
        tests:
          - not_null
      - name: dam
        tests:
          - not_null
      - name: district
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: taluka
        tests:
          - not_null
      - name: village
        tests:
          - not_null
      - name: endline_status
        tests:
          - accepted_values:
              values:
                - 'Endline Done'
                - 'Endline Not Done'

  - name: machine_endline_gramin_25
    description: "Machine Data Compiled with Endline Status from encounters"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: machine_name
        tests:
          - not_null
      - name: type_of_machine
        tests:
          - not_null
      - name: dam
        tests:
          - not_null
      - name: district
        tests:
          - not_null
      - name: subject_type
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: taluka
        tests:
          - not_null
      - name: village
        tests:
          - not_null
      - name: machine_voided
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: machine_approval_status
        tests:
          - not_null
      - name: endline_status
        tests:
          - accepted_values:
              values:
                - 'Endline Done'
                - 'Endline Not Done'
  - name: farmer_silt_vulnerable_gramin_25
    description: "Model that calculates silt carted for vulnerable and other farmers"
    columns:
      - name: state
        tests:
          - not_null
      - name: district
        tests:
          - not_null
      - name: taluka
        tests:
          - not_null
      - name: village
        tests:
          - not_null
      - name: dam
        tests:
          - not_null
      - name: ngo_name
        tests:
          - not_null
      - name: farmer_type
        tests:
          - not_null
          - accepted_values:
              values: ['vulnerable', 'others']
      - name: total_silt_carted
        tests:
          - not_null
  - name: barren_fertile_silt_gramin_25
    description: "Summarized silt data for endline farmers merged with work order and location details"
    columns:
      - name: work_order_name
        tests:
          - not_null

      - name: date_time
        tests:
          - not_null

      - name: state
        tests:
          - not_null

      - name: district
        tests:
          - not_null

      - name: taluka
        tests:
          - not_null

      - name: dam
        tests:
          - not_null

      - name: village
        tests:
          - not_null

      - name: ngo_name
        tests:
          - not_null

      - name: endline_status
        tests:
          - not_null
          - accepted_values:
              values: ['Endline Done']

      - name: type_of_land_silt_is_spread_on
        tests:
          - not_null
          - accepted_values:
              values: ['Barren', 'Fertile']

      - name: silt_achieved_by_endline_farmers
        tests:
          - not_null

      - name: total_farm_area_silt_is_spread_on
        tests:
          - not_null

  - name: gram_panchayat_gramin_25
    description: "Approved Gram Panchayat endline silt records enriched with work-order and location details."
    columns:
      - name: work_order_id
        tests:
          - not_null
      - name: work_order_name
        tests:
          - not_null
      - name: total_silt_excavated_by_gp_for_non_farm_purpose
        tests:
          - not_null

  - name: combined_silt_achievement_gramin_25
    description: "Work-order silt achievement combining farmer carting and Gram Panchayat non-farm excavation."
    columns:
      - name: work_order_name
        tests:
          - not_null
      - name: farmer_silt_achieved
        tests:
          - not_null
      - name: gp_silt_achieved
        tests:
          - not_null
      - name: total_silt_achieved
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= (farmer_silt_achieved + gp_silt_achieved)"
