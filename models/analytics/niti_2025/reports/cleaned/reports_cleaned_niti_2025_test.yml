version: 2

models:
  - name: active_work_order_niti_25
    description: |
      Work-order-level analytical table for NITI 2025 (one row per approved work order), joining registrations, approved farmer carting totals, approved GP/non-farm excavation totals, machine working hours, and endline status to compute activity metrics.

      CTEs
      - machine_type: Joins `work_order_farmer_niti_25` to `machine_regn_niti_25` to tag farmer-reported carting rows with machine type (using encounter approval statuses).
      - machine_type_pivot: Aggregates total silt carted per work order and machine type.
      - carting_by_machine_type: Produces work-order-level `jcb_excavation` and `poclain_excavation` (farmer-reported silt carted) from the pivoted results.
      - machine_silt: Aggregates approved machine working hours per work order, including totals and hours split by JCB vs Poclain.
      - machine_types_counted: Counts distinct approved machines used per work order, split by type (JCB/Poclain) and flags active counts based on machine endline completion.
      - approved_work_orders: Filters `work_order_regn_niti_25` down to approved work orders and selects core metadata (location, stakeholder, planned silt, start date).
      - farmer_level_silt: Aggregates approved silt carted at the farmer×work-order grain.
      - farmer_silt: Rolls farmer_level_silt up to work-order grain and derives `active_farmers` (>0 approved silt), plus total farmers.
      - farmer_silt_cl: Filters to work orders with non-zero farmer silt.
      - gp_silt: Aggregates approved GP/non-farmer excavation per work order from `gp_endline_niti_25`.
    columns:
      - name: workorderid
        description: "Work order subject identifier."
        tests:
          - not_null
      - name: workorder_name
        description: "Work order name captured during registration."
      - name: updated_workorder_name
        description: "Updated work order name captured during registration."
      - name: state
        description: "State for the work order location."
      - name: district
        description: "District for the work order location."
      - name: taluka
        description: "Taluka for the work order location."
      - name: village
        description: "Village for the work order location."
      - name: dam
        description: "Dam/waterbody name for the work order location."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the work order/dam."
      - name: silt_to_be_excavated_as_per_plan
        description: "Planned silt to be excavated (cu.m) for the work order."
      - name: total_silt_carted_by_farmers
        description: "Total approved silt carted by farmers (cu.m) for the work order."
      - name: total_silt_excavated_by_gp_non_farm
        description: "Total approved silt excavated by GP/non-farm purposes (cu.m) for the work order."
      - name: total_silt_excavated
        description: "Total silt excavated (farmers + GP/non-farm) for the work order."
      - name: total_machine_working_hours
        description: "Total approved machine working hours (all types) for the work order."
      - name: poclain_count
        description: "Count of distinct approved poclain machines associated with the work order."
      - name: jcb_count
        description: "Count of distinct approved JCB machines associated with the work order."
      - name: total_number_of_farmers
        description: "Total distinct farmers associated with the work order (including 0-silt farmers)."
      - name: work_order_start_date
        description: "Work order registration date cast as a timestamp."
      - name: workorder_endline_date
        description: "Work order endline date (NULL if endline not completed)."
      - name: jcb_working_hours
        description: "Approved machine working hours attributed to JCBs for the work order."
      - name: poclain_working_hours
        description: "Approved machine working hours attributed to poclains for the work order."
      - name: jcb_excavation
        description: "Farmer-reported silt carted attributed to JCBs for the work order."
      - name: poclain_excavation
        description: "Farmer-reported silt carted attributed to poclains for the work order."
      - name: active_farmers
        description: "Count of farmers with > 0 approved silt carted for the work order."
      - name: active_poclains
        description: "Active poclain count (non-zero only while the work order has no endline date)."
      - name: active_jcbs
        description: "Active JCB count (non-zero only while the work order has no endline date)."
      - name: active_work_orders
        description: "Active work order flag (1 when endline date is NULL, else 0)."
      - name: active_work_order_days
        description: "Elapsed days between start date and endline date (0 when endline date is NULL)."

  - name: daily_farmer_linelist_niti_25
    description: "Cleaned linelist of farmer daily recording encounters for NITI 2025, filtered to records where farmer, work order, and encounter approvals are all Approved."
    columns:
      - name: workorder_name
        description: "Work order name captured during registration."
      - name: updated_workorder_name
        description: "Updated work order name captured during registration."
      - name: farmer_name
        description: "Farmer name from registration."
      - name: farmer_id
        description: "Farmer identifier."
        tests:
          - not_null
      - name: state
        description: "State for the farmer/work order location."
      - name: district
        description: "District for the farmer/work order location."
      - name: village
        description: "Village for the farmer/work order location."
      - name: taluka
        description: "Taluka for the farmer/work order location."
      - name: dam
        description: "Dam/waterbody for the farmer/work order location."
      - name: gp
        description: "Gram panchayat for the farmer/work order location."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the work order/dam."
      - name: trolleys_carted
        description: "Number of trolleys carted in the encounter."
      - name: hyvas_carted
        description: "Number of hyvas/dumpers carted in the encounter."
      - name: silt_carted
        description: "Silt carted in the encounter (cu.m)."
      - name: if_silt_used_non_farm_purpose
        description: "Whether silt was used for non-farm purpose in the encounter."
      - name: purpose_of_carting_silt
        description: "Purpose of carting silt captured in observations."
      - name: amt_silt_used_non_farm_purpose
        description: "Amount of silt used for non-farm purpose in the encounter (cu.m)."
      - name: other_person_taking_silt
        description: "Other person taking silt (if captured)."
      - name: other_purpose_of_carting_silt
        description: "Other purpose of carting silt (if captured)."
      - name: silt_taken_by
        description: "Who the silt was taken by (if captured)."
      - name: work_order_id
        description: "Work order identifier."
        tests:
          - not_null
      - name: work_order_approval_status
        description: "Approval status for the work order."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]
      - name: farmer_approval_status
        description: "Approval status for the farmer."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]
      - name: approval_status
        description: "Approval status for the daily recording encounter."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]

  - name: daily_machine_linelist_niti_25
    description: "Cleaned linelist of machine daily recording encounters for NITI 2025, filtered to encounters with encounter_approval_status = Approved."
    columns:
      - name: machine_work_order_sub_id
        description: "Work order subject identifier associated with this machine encounter."
        tests:
          - not_null
      - name: machine_name
        description: "Machine name from registration."
      - name: encounter_date_time
        description: "Timestamp when the machine encounter occurred."
      - name: contractor_name
        description: "Contractor name associated with the machine."
      - name: contractor_mobile_number
        description: "Contractor mobile number associated with the machine."
      - name: state
        description: "State for the machine/work order location."
      - name: district
        description: "District for the machine/work order location."
      - name: taluka
        description: "Taluka for the machine/work order location."
      - name: village
        description: "Village for the machine/work order location."
      - name: dam
        description: "Dam/waterbody for the machine/work order location."
      - name: gp
        description: "Gram panchayat for the machine/work order location."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the work order/dam."
      - name: approval_status
        description: "Approval status for the machine encounter."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]
      - name: log_book_image_machine
        description: "Log book image URL/reference captured for the machine encounter."
      - name: working_hours
        description: "Machine working hours captured in the encounter."

  - name: farmer_endline_linelist_niti_25
    description: "Cleaned linelist of farmer endline encounters for NITI 2025, keeping only the latest endline per farmer where approval_status = Approved."
    columns:
      - name: farmer_name
        description: "Farmer name from registration."
      - name: farmer_beneficiary_id
        description: "Farmer subject identifier associated with the endline."
        tests:
          - not_null
      - name: encounter_date_time
        description: "Timestamp when the endline encounter occurred."
      - name: state
        description: "State for the farmer location."
      - name: district
        description: "District for the farmer location."
      - name: taluka
        description: "Taluka for the farmer location."
      - name: village
        description: "Village for the farmer location."
      - name: dam
        description: "Dam/waterbody for the farmer location."
      - name: gp
        description: "Gram panchayat for the farmer location."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the dam/location."
      - name: total_silt_excavated
        description: "Total silt excavated captured in the endline (cu.m)."
      - name: area_silt_spread
        description: "Area where silt was spread captured in the endline."
      - name: type_of_land_silt_is_spread_on
        description: "Type of land where the silt is spread on (as captured)."
      - name: major_crops_grown
        description: "Major crops grown (as captured)."
      - name: major_to_be_grown
        description: "Major crops to be grown (as captured)."
      - name: approval_status
        description: "Approval status for the endline encounter."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]

  - name: farmer_linelist_niti_25
    description: "Cleaned farmer registration/progress linelist for NITI 2025, filtered to farmers with approval_status = Approved."
    columns:
      - name: farmer_id
        description: "Farmer subject identifier."
        tests:
          - not_null
      - name: farmer_name
        description: "Farmer name from registration."
      - name: state
        description: "State for the farmer location."
      - name: district
        description: "District for the farmer location."
      - name: taluka
        description: "Taluka for the farmer location."
      - name: village
        description: "Village for the farmer location."
      - name: dam
        description: "Dam/waterbody for the farmer location."
      - name: gp
        description: "Gram panchayat for the farmer location."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the dam/location."
      - name: mobile_number
        description: "Farmer mobile phone number."
      - name: land_holding
        description: "Land holding in acres (numeric)."
      - name: farmer_category
        description: "Farmer category captured during registration."
      - name: approval_status
        description: "Approval status for the farmer registration."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]
      - name: area_silt_spread
        description: "Area silt spread from the latest farmer endline (if present)."
      - name: total_trolleys_carted
        description: "Total trolleys carted across all encounters for the farmer."
      - name: total_hyvas_carted
        description: "Total hyvas carted across all encounters for the farmer."
      - name: total_silt_carted
        description: "Total silt carted across all encounters for the farmer (cu.m)."

  - name: machine_endline_linelist_niti_25
    description: "Cleaned machine endline linelist for NITI 2025, filtered to machine endlines with approval_status = Approved."
    columns:
      - name: machine_name
        description: "Machine name from registration."
      - name: machine_id
        description: "Machine subject identifier."
        tests:
          - not_null
      - name: machine_type
        description: "Machine type (e.g., JCB, Poclain)."
      - name: total_machine_working_hours
        description: "Total machine working hours captured in the endline (numeric)."
      - name: endline_date_time
        description: "Timestamp when the machine endline encounter occurred."
      - name: state
        description: "State for the machine location."
      - name: district
        description: "District for the machine location."
      - name: taluka
        description: "Taluka for the machine location."
      - name: village
        description: "Village for the machine location."
      - name: dam
        description: "Dam/waterbody for the machine location."
      - name: gp
        description: "Gram panchayat for the machine location."
      - name: approval_status
        description: "Approval status for the machine endline encounter."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]

  - name: machine_linelist_niti_25
    description: "Cleaned machine registration linelist for NITI 2025, filtered to machines with approval_status = Approved."
    columns:
      - name: machine_name
        description: "Machine name from registration."
      - name: registration_date
        description: "Date/time when the machine was registered."
      - name: uuid
        description: "Machine subject identifier."
        tests:
          - not_null
      - name: state
        description: "State for the machine location."
      - name: district
        description: "District for the machine location."
      - name: taluka
        description: "Taluka for the machine location."
      - name: village
        description: "Village for the machine location."
      - name: gp
        description: "Gram panchayat for the machine location."
      - name: dam
        description: "Dam/waterbody for the machine location."
      - name: machine_type
        description: "Machine type (e.g., JCB, Poclain)."
      - name: contractor_name
        description: "Contractor name associated with the machine."
      - name: contractor_mobile_number
        description: "Contractor mobile number associated with the machine."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the dam/location."
      - name: approval_status
        description: "Approval status for the machine registration."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]

  - name: waterbody_linelist_niti_25
    description: "Cleaned waterbody linelist for NITI 2025 sourced from location_niti_25, exposing location hierarchy, silt target, and GPS attributes."
    columns:
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: state
        description: "State for the waterbody location."
      - name: district
        description: "District for the waterbody location."
      - name: taluka
        description: "Taluka for the waterbody location."
      - name: village
        description: "Village for the waterbody location."
      - name: estimated_silt_quantity
        description: "Estimated silt target/quantity for the waterbody (from silt_target)."
      - name: site_gps_latitude
        description: "Site GPS latitude captured in location custom properties."
      - name: site_gps_longitude
        description: "Site GPS longitude captured in location custom properties."
      - name: gram_panchayat_name
        description: "Gram panchayat name associated with the waterbody."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the waterbody."

  - name: workorder_endline_linelist_niti_25
    description: "Cleaned work order endline linelist for NITI 2025, filtered to endlines with approval_status = Approved (latest per work order)."
    columns:
      - name: workorder_name
        description: "Work order name captured during registration."
      - name: workorder_id
        description: "Work order subject identifier."
        tests:
          - not_null
      - name: updated_workorder_name
        description: "Updated work order name captured during registration."
      - name: state
        description: "State for the work order location."
      - name: district
        description: "District for the work order location."
      - name: village
        description: "Village for the work order location."
      - name: taluka
        description: "Taluka for the work order location."
      - name: dam
        description: "Dam/waterbody for the work order location."
      - name: gp
        description: "Gram panchayat for the work order location."
      - name: endline_date
        description: "Timestamp of the latest work order endline encounter."
      - name: stakeholder_responsible
        description: "Stakeholder/NGO associated with the endline record."
      - name: site_video
        description: "Site video captured during endline."
      - name: mb_recording_done
        description: "Whether MB recording is done (as captured)."
      - name: site_image_1_url
        description: "Site image 1 URL/reference captured during endline."
      - name: site_image_2_url
        description: "Site image 2 URL/reference captured during endline."
      - name: total_silt_excavated
        description: "Total silt excavated captured in endline (cu.m)."
      - name: mb_document_url
        description: "URL/reference for the MB document."
      - name: silt_excavated_as_per_mb
        description: "Silt excavated as per MB recording (cu.m)."
      - name: is_mb_data_same_as_app_data
        description: "Whether MB data matches app data (as captured)."
      - name: approval_status
        description: "Approval status for the endline encounter."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]

  - name: workorder_linelist_niti_25
    description: "Cleaned work order registration linelist for NITI 2025, filtered to work orders with approval_status = Approved."
    columns:
      - name: workorder_name
        description: "Work order name captured during registration."
      - name: updated_workorder_name
        description: "Updated work order name captured during registration."
      - name: registration_date
        description: "Work order registration date/time."
      - name: state
        description: "State for the work order location."
      - name: district
        description: "District for the work order location."
      - name: village
        description: "Village for the work order location."
      - name: taluka
        description: "Taluka for the work order location."
      - name: dam
        description: "Dam/waterbody for the work order location."
      - name: gp
        description: "Gram panchayat for the work order location."
      - name: silt_to_be_excavated_as_per_plan
        description: "Planned silt to be excavated (cu.m) captured during registration."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the work order/dam."
      - name: endline_date
        description: "Work order endline encounter date/time (if present)."
      - name: site_image_1_url
        description: "Site image 1 URL/reference captured during registration."
      - name: site_image_2_url
        description: "Site image 2 URL/reference captured during registration."
      - name: site_video_url
        description: "Site video URL/reference captured during registration."
      - name: noc_workorder_image
        description: "NOC/work order image URL/reference captured during registration."
      - name: site_marking_image
        description: "Site marking image URL/reference captured during registration."
      - name: contractor_name
        description: "Latest known contractor name for machines reporting to this work order."
      - name: approval_status
        description: "Approval status for the work order registration."
        tests:
          - not_null
          - accepted_values:
              values: ["Approved"]
