version: 2

models:
  - name: dam_wise_farmer_gdgs_25
    description: "Dam-level rollup of farmer daily recordings and farmer endlines for GDGS 2025, split by farmer category and non-farm silt usage."
    columns:
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: state
        description: "State for the dam/location."
      - name: district
        description: "District for the dam/location."
      - name: taluka
        description: "Taluka for the dam/location."
      - name: village
        description: "Village for the dam/location."
      - name: gp
        description: "Gram panchayat name for the dam/location."
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the dam/location."
      - name: total_daily_recordings
        description: "Total count of farmer daily recording encounters for this dam."
      - name: mobile_verified_farmers
        description: "Count of mobile-verified farmers among farmers who have at least one daily recording for this dam."
      - name: registered_farmers
        description: "Count of farmers with at least one daily recording for this dam."
      - name: farmers_with_endline_done
        description: "Count of farmers with an endline record for this dam."
      - name: area_silt_spread
        description: "Total farm area where silt was spread (as captured) from farmer endlines for this dam."

  - name: dam_wise_work_order_gdgs_25
    description: "Dam-level rollup of work orders and activity metrics for GDGS 2025 derived from active_work_order_gdgs_25."
    columns:
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: state
        description: "State for the dam/location."
      - name: district
        description: "District for the dam/location."
      - name: taluka
        description: "Taluka for the dam/location."
      - name: village
        description: "Village for the dam/location."
      - name: registered_work_orders
        description: "Count of registered work orders for this dam."
      - name: work_order_endlines_completed
        description: "Count of work orders with an endline date present."
      - name: active_work_orders
        description: "Count of work orders with no endline date (active)."
      - name: silt_to_be_excavated_as_per_plan
        description: "Total planned silt to be excavated (cu.m) across work orders for this dam."
      - name: total_silt_carted_by_farmers
        description: "Total silt carted by farmers (cu.m) across work orders for this dam."
      - name: total_machine_working_hours
        description: "Total machine working hours across work orders for this dam."

  - name: org_level_gdgs_25
    description: "Stakeholder-level rollup of work orders and activity metrics for GDGS 2025 derived from active_work_order_gdgs_25."
    columns:
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the work orders."
        tests:
          - not_null
      - name: number_districts
        description: "Count of distinct districts covered by the stakeholder."
      - name: number_waterbodies
        description: "Count of distinct dams/waterbodies covered by the stakeholder."
      - name: registered_work_orders
        description: "Count of registered work orders for the stakeholder."
      - name: active_work_orders
        description: "Count of work orders with no endline date (active)."
      - name: total_silt_carted_by_farmers
        description: "Total silt carted by farmers (cu.m) across work orders for the stakeholder."
      - name: total_machine_working_hours
        description: "Total machine working hours across work orders for the stakeholder."

  - name: overall_approval_statistics_gdgs_25
    description: "Counts records by approval status across entity types (registrations and encounters) for GDGS 2025, grouped by location hierarchy."
    columns:
      - name: Characteristic
        description: "Entity/characteristic name (e.g., Farmer Registration, Work order endline)."
        tests:
          - not_null
      - name: state
        description: "State for the entity record."
      - name: district
        description: "District for the entity record."
      - name: taluka
        description: "Taluka for the entity record."
      - name: village
        description: "Village for the entity record."
      - name: dam
        description: "Dam/waterbody for the entity record."
      - name: total_registrations
        description: "Total number of records observed for the characteristic and location."
      - name: approved_count
        description: "Count of records with approval_status = Approved."
      - name: pending_count
        description: "Count of records with approval_status = Pending."
      - name: rejected_count
        description: "Count of records with approval_status = Rejected."

  - name: work_order_aggregate_dam_gdgs_25
    description: "Work-order-level summary per dam for GDGS 2025, aggregating silt, farmer, machine totals and elapsed days from active_work_order_gdgs_25."
    columns:
      - name: workorderid
        description: "Work order subject identifier."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody name for the work order."
      - name: state
        description: "State for the work order location."
      - name: district
        description: "District for the work order location."
      - name: taluka
        description: "Taluka for the work order location."
      - name: village
        description: "Village for the work order location."
      - name: silt_to_be_excavated_as_per_plan
        description: "Planned silt to be excavated (cu.m) for the work order."
      - name: total_silt_carted_by_farmers
        description: "Silt carted by farmers (cu.m) for the work order."
      - name: total_machine_working_hours
        description: "Total machine working hours for the work order."

  - name: work_order_aggregate_org_gdgs_25
    description: "Work-order-level summary per stakeholder for GDGS 2025, aggregating silt, farmer, machine totals and elapsed days from active_work_order_gdgs_25."
    columns:
      - name: stakeholder_responsible
        description: "Stakeholder responsible for the work order."
        tests:
          - not_null
      - name: workorderid
        description: "Work order subject identifier."
        tests:
          - not_null
      - name: silt_to_be_excavated_as_per_plan
        description: "Planned silt to be excavated (cu.m) for the work order."
      - name: total_silt_carted_by_farmers
        description: "Silt carted by farmers (cu.m) for the work order."
      - name: total_machine_working_hours
        description: "Total machine working hours for the work order."

  - name: ss_combined_silt_gdgs_25
    description: "Combined silt achievement data from approved farmer progress for GDGS 2025 using analytics lineage, with GP columns retained as zero for schema alignment."
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
          max_value: 1000000
      - dbt_expectations.expect_compound_columns_to_be_unique:
          column_list: ["state", "district", "taluka", "village", "work_order_name"]
    columns:
      - name: state
        description: "State name."
        tests:
          - not_null
      - name: district
        description: "District name."
        tests:
          - not_null
      - name: taluka
        description: "Taluka name."
        tests:
          - not_null
      - name: village
        description: "Village name."
        tests:
          - not_null
      - name: dam
        description: "Name of the dam."
      - name: work_order_name
        description: "Name of the work order."
        tests:
          - not_null
      - name: ngo_name
        description: "Name of the stakeholder responsible."
        tests:
          - not_null
      - name: farmer_silt_achieved
        description: "Total silt achieved by farmers."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: total_farm_area_with_silt
        description: "Total farm area where silt is spread from approved farmer endlines."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: gp_silt_achieved
        description: "Schema-alignment placeholder for GP/non-farm silt; this is 0 for GDGS 2025."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000000
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: total_silt_achieved
        description: "Combined total silt achieved for the work order grouping."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= (farmer_silt_achieved + gp_silt_achieved)"
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: last_updated
        description: "Most recent farmer update timestamp represented in the grouping."
        tests:
          - not_null

  - name: ss_progress_dam_gdgs_25
    description: "Approved work order progress status for GDGS 2025 using analytics lineage."
    columns:
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: work_order_id
        description: "Work order subject identifier."
        tests:
          - not_null
          - unique
      - name: state
        description: "State for the work order location."
        tests:
          - not_null
      - name: village
        description: "Village for the work order location."
        tests:
          - not_null
      - name: district
        description: "District for the work order location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the work order location."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the work order."
        tests:
          - not_null
      - name: endline_date
        description: "Latest approved work order endline timestamp."
      - name: farmer_date
        description: "Latest approved farmer daily encounter timestamp for the work order."
      - name: project_status
        description: "Progress status derived from approved endline and farmer activity."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Ongoing"
                - "Completed"
                - "Not Started"
      - name: work_order_endline_status
        description: "Whether the approved work order endline exists."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Endline Done"
                - "Endline Not Done"

  - name: ss_silt_per_acre_gdgs_25
    description: "Silt-per-acre summary for GDGS 2025 using analytics lineage."
    columns:
      - name: work_order_name
        description: "Name of the work order."
        tests:
          - not_null
      - name: state
        description: "State for the work order location."
        tests:
          - not_null
      - name: district
        description: "District for the work order location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the work order location."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the work order."
        tests:
          - not_null
      - name: village
        description: "Village for the work order location."
        tests:
          - not_null
      - name: endline_status
        description: "Farmer endline completion status included in the aggregation."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Endline Done"
      - name: date_time
        description: "Latest approved farmer daily encounter timestamp for the aggregated work order."
        tests:
          - not_null
      - name: silt_achieved_by_endline_farmers
        description: "Total approved silt achieved by farmers with endlines."
        tests:
          - not_null
      - name: total_farm_area_silt_is_spread_on
        description: "Total farm area recorded in approved farmer endlines."
        tests:
          - not_null
      - name: silt_per_acre
        description: "Computed silt achieved per acre."
      - name: silt_per_acre_benchmark_classification
        description: "Benchmark classification based on the silt-per-acre threshold."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Above Benchmark"
                - "Below Benchmark"

  - name: ss_farmer_vulnerable_gdgs_25
    description: "Farmer vulnerability split for GDGS 2025 using distinct farmers from daily_farmer_linelist_gdgs_25 and farmer_regn_gdgs_25 categories, grouping marginal+small as vulnerable and semi-medium+medium+large as others, with farmer counts and total silt carted."
    columns:
      - name: state
        description: "State for the location."
        tests:
          - not_null
      - name: district
        description: "District for the location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the location."
        tests:
          - not_null
      - name: village
        description: "Village for the location."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the location."
        tests:
          - not_null
      - name: farmer_type
        description: "Farmer vulnerability grouping."
        tests:
          - not_null
          - accepted_values:
              values:
                - "vulnerable"
                - "others"
      - name: farmers_count
        description: "Number of farmers in the vulnerability grouping."
        tests:
          - not_null
      - name: total_silt_carted
        description: "Total silt carted by farmers in the vulnerability grouping."
        tests:
          - not_null

  - name: ss_farmer_endline_gdgs_25
    description: "Farmer endline status for GDGS 2025 using approved farmer registrations and approved farmer endline linelist data."
    columns:
      - name: farmer_id
        description: "Farmer subject identifier."
        tests:
          - not_null
      - name: farmer_name
        description: "Farmer name."
        tests:
          - not_null
      - name: state
        description: "State for the farmer location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the farmer location."
        tests:
          - not_null
      - name: village
        description: "Village for the farmer location."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: district
        description: "District for the farmer location."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the farmer."
        tests:
          - not_null
      - name: type_of_land_silt_is_spread_on
        description: "Type of land where silt is spread."
      - name: total_farm_area_silt_is_spread_on
        description: "Farm area where silt is spread from the approved farmer endline."
      - name: distance_from_waterbody
        description: "Distance from the waterbody captured in the farmer endline."
      - name: endline_status
        description: "Whether an approved farmer endline exists."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Endline Done"
                - "Endline Not Done"

  - name: ss_farmer_agg_gdgs_25
    description: "Aggregated farmer data by location for GDGS 2025 using daily_farmer_linelist_gdgs_25 and farmer_regn_gdgs_25."
    columns:
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: date_time
        description: "Latest approved daily farmer encounter timestamp at the grouped location grain."
        tests:
          - not_null
      - name: state
        description: "State for the location."
        tests:
          - not_null
      - name: district
        description: "District for the location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the location."
        tests:
          - not_null
      - name: village
        description: "Village for the location."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the location."
        tests:
          - not_null
      - name: verified_farmers
        description: "Count of farmers with mobile verification status = true."
        tests:
          - not_null
      - name: unverified_farmers
        description: "Count of farmers with mobile verification status = false."
        tests:
          - not_null
      - name: total
        description: "Total number of farmers in the grouped location grain."
        tests:
          - not_null
      - name: vulnerable_marginal
        description: "Count of marginal farmers."
        tests:
          - not_null
      - name: vulnerable_small
        description: "Count of small farmers."
        tests:
          - not_null
      - name: semi_medium
        description: "Count of semi-medium farmers."
        tests:
          - not_null
      - name: medium
        description: "Count of medium farmers."
        tests:
          - not_null
      - name: large
        description: "Count of large farmers."
        tests:
          - not_null

  - name: ss_barren_fertile_silt_gdgs_25
    description: "Summarized silt data for approved endline farmers merged with work-order and location details in the analytics GDGS 2025 lineage, including type of land where silt is spread."
    columns:
      - name: work_order_name
        description: "Work order name from the approved daily farmer linelist."
        tests:
          - not_null
      - name: date_time
        description: "Latest approved daily farmer encounter date for the grouped work order and location grain."
        tests:
          - not_null
      - name: state
        description: "State for the work order location."
        tests:
          - not_null
      - name: district
        description: "District for the work order location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the work order location."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody name."
        tests:
          - not_null
      - name: village
        description: "Village for the work order location."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the work order location."
        tests:
          - not_null
      - name: endline_status
        description: "Farmer endline status represented in this model."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Endline Done"
      - name: type_of_land_silt_is_spread_on
        description: "Type of land where silt is spread from farmer_endline_linelist_gdgs_25."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Barren"
                - "Fertile"
      - name: silt_achieved_by_endline_farmers
        description: "Total approved silt carted by farmers with approved endlines."
        tests:
          - not_null
      - name: total_farm_area_silt_is_spread_on
        description: "Total farm area on which silt is spread from the approved farmer endline."
        tests:
          - not_null

  - name: ss_machine_endline_gdgs_25
    description: "Machine data compiled with endline status for GDGS 2025 using analytics lineage, limited to approved machines that appear in approved daily machine recordings."
    columns:
      - name: machine_id
        description: "Machine subject identifier."
        tests:
          - not_null
      - name: subject_type
        description: "Subject type from the machine registration."
        tests:
          - not_null
      - name: machine_voided
        description: "Voided flag from the machine registration."
        tests:
          - not_null
          - accepted_values:
              values:
                - true
                - false
      - name: machine_name
        description: "Machine name from the approved machine registration."
        tests:
          - not_null
      - name: type_of_machine
        description: "Machine type from the approved machine registration."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody for the machine location."
        tests:
          - not_null
      - name: district
        description: "District for the machine location."
        tests:
          - not_null
      - name: state
        description: "State for the machine location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the machine location."
        tests:
          - not_null
      - name: village
        description: "Village for the machine location."
        tests:
          - not_null
      - name: machine_approval_status
        description: "Approval status for the machine registration."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Approved"
      - name: ngo_name
        description: "Stakeholder responsible for the machine location."
        tests:
          - not_null
      - name: endline_status
        description: "Whether an approved machine endline exists for the machine."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Endline Done"
                - "Endline Not Done"

  - name: ss_machine_metric_gdgs_25
    description: "Machine efficiency metrics for GDGS 2025 using analytics lineage from daily_machine_linelist_gdgs_25 and daily_farmer_linelist_gdgs_25."
    columns:
      - name: machine_id
        description: "Machine subject identifier."
        tests:
          - not_null
      - name: machine_name
        description: "Machine name."
        tests:
          - not_null
      - name: type_of_machine
        description: "Machine type."
        tests:
          - not_null
      - name: dam
        description: "Dam/waterbody for the machine location."
        tests:
          - not_null
      - name: district
        description: "District for the machine location."
        tests:
          - not_null
      - name: state
        description: "State for the machine location."
        tests:
          - not_null
      - name: taluka
        description: "Taluka for the machine location."
        tests:
          - not_null
      - name: village
        description: "Village for the machine location."
        tests:
          - not_null
      - name: ngo_name
        description: "Stakeholder responsible for the machine location."
        tests:
          - not_null
      - name: date_time
        description: "Latest approved daily machine encounter date for the machine."
        tests:
          - not_null
      - name: total_silt_carted
        description: "Total approved silt carted attributed to the machine from farmer daily recordings."
        tests:
          - not_null
      - name: total_working_hours
        description: "Total approved machine working hours from daily machine recordings."
        tests:
          - not_null
      - name: avg_silt_excavated_per_hour
        description: "Average silt excavated per machine working hour."
        tests:
          - not_null
      - name: benchmark_classification
        description: "Benchmark classification based on machine type and average excavation rate."
        tests:
          - not_null
          - accepted_values:
              values:
                - "Above Benchmark"
                - "Below Benchmark"
                - "Unknown"
